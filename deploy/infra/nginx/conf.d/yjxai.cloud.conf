# /opt/infra/nginx/conf.d/yjxai.cloud.conf
# 由边缘 nginx 容器挂载到 /etc/nginx/conf.d/（见同目录 docker-compose.yml）。
# 静态站点目录 /var/www/yjxai 由 GitHub Actions rsync 写入，容器只读挂载。

# ==========================================================================
# 其它项目通过服务别名接入，在这里按子路径反代。
# 前提：目标项目的容器已加入 infra-net，并在其 compose 里声明了网络别名。
# ==========================================================================
# upstream forgeai_backend { server forgeai-backend:8080; keepalive 16; }
# upstream hengpick_api  { server hengpick-api:8090;  keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name yjxai.cloud www.yjxai.cloud;

    charset utf-8;
    client_max_body_size 20m;

    # ----------------------------------------------------------------------
    # Let's Encrypt 域名验证目录（certbot webroot 模式，见 README 第四节）
    # 必须独立于 /var/www/yjxai —— CI 用 rsync --delete 同步站点，
    # 挑战文件若放在站点目录里会被每次发版删掉，导致证书续期失败。
    # ^~ 保证它优先于下方的正则 location（隐藏文件拒绝规则）。
    # 注意：这个 location 不能删，HTTPS 启用后也要保留。
    # ----------------------------------------------------------------------
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    # ----------------------------------------------------------------------
    # 其余流量一律跳转 HTTPS：站点内容由文件末尾的 443 块提供
    # ----------------------------------------------------------------------
    location / {
        return 301 https://$host$request_uri;
    }

    # 其它项目的反代配置见文件末尾的 HTTPS 入口块（80 只负责跳转，不承载业务）

    # 隐藏文件与备份文件
    location ~ /\.(?!well-known) {
        deny all;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/woff2;

    # 容器内日志走 stdout/stderr，用 docker compose logs 查看
    access_log /dev/stdout;
    error_log  /dev/stderr;
}

# ==========================================================================
# HTTPS 入口：站点内容由这里提供（80 只负责跳转）
# 证书由 certbot 以 webroot 模式签发，自动续期见 README 第四节。
# 证书文件不存在时 nginx 会启动失败，改这里前务必确认证书已签发。
# ==========================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                                      # nginx 1.25.1+ 写法
    server_name yjxai.cloud www.yjxai.cloud;

    ssl_certificate     /etc/letsencrypt/live/yjxai.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yjxai.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/yjxai;
    index index.html;

    charset utf-8;
    client_max_body_size 20m;

    # ACME 挑战保留在 80，这里不需要

    # 本站：Vue SPA —— 未命中的路径一律回退到 index.html，交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 构建产物带内容哈希，可长期强缓存
    location /assets/ {
        expires 1y;
        access_log off;
    }

    # 入口 HTML 不缓存，保证每次发版立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ----------------------------------------------------------------------
    # 其它项目反代骨架：一个子路径对应一个项目，按需启用
    # 前提：目标项目的容器已加入 infra-net，并在其 compose 里声明了网络别名。
    # ----------------------------------------------------------------------
    # location /api/ {
    #     proxy_pass http://hengpick_api/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     # SSE / 流式接口必须关闭缓冲
    #     proxy_buffering off;
    #     proxy_read_timeout 300s;
    # }

    # location /lab/ {
    #     proxy_pass http://forgeai_web/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # 隐藏文件与备份文件
    location ~ /\.(?!well-known) {
        deny all;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/woff2;

    access_log /dev/stdout;
    error_log  /dev/stderr;
}
